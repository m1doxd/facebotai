<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>FaceBot — Gemini API Test</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #0f1115;
      color: #f5f5f5;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 800px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 32px;
    }

    .subtitle {
      color: #9ca3af;
      margin-bottom: 30px;
    }

    .card {
      background: #181b21;
      border: 1px solid #2b3038;
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 20px;
    }

    .upload {
      border: 2px dashed #3a404a;
      border-radius: 12px;
      padding: 35px 20px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
    }

    .upload:hover {
      border-color: #6b7280;
      background: #1d2027;
    }

    .upload input {
      display: none;
    }

    .upload-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .upload-info {
      color: #8b929e;
      font-size: 14px;
    }

    #preview {
      display: none;
      max-width: 100%;
      max-height: 400px;
      margin: 20px auto 0;
      border-radius: 10px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 14px 20px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      background: #ffffff;
      color: #111111;
      margin-top: 18px;
    }

    button:hover {
      background: #e5e7eb;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status {
      margin-top: 18px;
      padding: 12px 14px;
      border-radius: 8px;
      background: #111318;
      color: #aeb5c0;
      font-size: 14px;
      display: none;
    }

    .result {
      display: none;
    }

    .score {
      font-size: 54px;
      font-weight: 700;
      margin: 10px 0;
    }

    .score-label {
      color: #9ca3af;
      font-size: 14px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 20px;
    }

    .stat {
      background: #111318;
      border-radius: 10px;
      padding: 16px;
    }

    .stat-label {
      color: #8b929e;
      font-size: 12px;
      margin-bottom: 6px;
    }

    .stat-value {
      font-size: 20px;
      font-weight: 600;
    }

    pre {
      margin: 20px 0 0;
      padding: 18px;
      background: #0b0d10;
      border: 1px solid #262b33;
      border-radius: 10px;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 13px;
      line-height: 1.5;
      color: #d1d5db;
    }

    .error {
      color: #fca5a5;
    }

    @media (max-width: 600px) {
      .stats {
        grid-template-columns: 1fr;
      }

      body {
        padding: 20px 12px;
      }

      .card {
        padding: 18px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>FaceBot Gemini Test</h1>

    <div class="subtitle">
      Тест API <code>/api/analyze</code>
    </div>


    <!-- UPLOAD -->

    <div class="card">

      <label class="upload">

        <input
          id="fileInput"
          type="file"
          accept="image/jpeg,image/png,image/webp"
        />

        <div class="upload-title">
          Выбери фотографию
        </div>

        <div class="upload-info">
          JPG, PNG или WEBP — максимум 15 MB
        </div>

        <img
          id="preview"
          alt="Preview"
        />

      </label>


      <button
        id="analyzeButton"
        disabled
      >
        Analyze
      </button>


      <div
        id="status"
        class="status"
      ></div>

    </div>


    <!-- RESULT -->

    <div
      id="result"
      class="card result"
    >

      <div class="score-label">
        FACE SCORE
      </div>

      <div
        id="score"
        class="score"
      >
        —
      </div>


      <div class="stats">

        <div class="stat">

          <div class="stat-label">
            Faces
          </div>

          <div
            id="faceCount"
            class="stat-value"
          >
            —
          </div>

        </div>


        <div class="stat">

          <div class="stat-label">
            Features
          </div>

          <div
            id="featureCount"
            class="stat-value"
          >
            —
          </div>

        </div>


        <div class="stat">

          <div class="stat-label">
            Model
          </div>

          <div
            id="model"
            class="stat-value"
          >
            —
          </div>

        </div>

      </div>


      <pre id="jsonOutput"></pre>

    </div>

  </div>


  <script>

    // ==================================================
    // CONFIG
    // ==================================================

    const API_URL =
      "https://facebotpsl.snow4lyt.workers.dev/api/analyze";


    // ==================================================
    // ELEMENTS
    // ==================================================

    const fileInput =
      document.getElementById(
        "fileInput"
      );

    const preview =
      document.getElementById(
        "preview"
      );

    const analyzeButton =
      document.getElementById(
        "analyzeButton"
      );

    const status =
      document.getElementById(
        "status"
      );

    const result =
      document.getElementById(
        "result"
      );

    const score =
      document.getElementById(
        "score"
      );

    const faceCount =
      document.getElementById(
        "faceCount"
      );

    const featureCount =
      document.getElementById(
        "featureCount"
      );

    const model =
      document.getElementById(
        "model"
      );

    const jsonOutput =
      document.getElementById(
        "jsonOutput"
      );


    let selectedFile = null;


    // ==================================================
    // FILE SELECT
    // ==================================================

    fileInput.addEventListener(
      "change",
      () => {

        const file =
          fileInput.files?.[0];


        if (!file) {

          selectedFile = null;

          analyzeButton.disabled =
            true;

          preview.style.display =
            "none";

          return;
        }


        // Check MIME

        const allowedTypes = [
          "image/jpeg",
          "image/png",
          "image/webp"
        ];


        if (
          !allowedTypes.includes(
            file.type
          )
        ) {

          showStatus(
            "Ошибка: разрешены только JPG, PNG и WEBP.",
            true
          );

          fileInput.value = "";

          selectedFile = null;

          analyzeButton.disabled =
            true;

          return;
        }


        // Check size

        const maxSize =
          15 * 1024 * 1024;


        if (
          file.size > maxSize
        ) {

          showStatus(
            "Ошибка: файл больше 15 MB.",
            true
          );

          fileInput.value = "";

          selectedFile = null;

          analyzeButton.disabled =
            true;

          return;
        }


        selectedFile =
          file;


        // Preview

        const objectUrl =
          URL.createObjectURL(
            file
          );


        preview.src =
          objectUrl;

        preview.style.display =
          "block";


        analyzeButton.disabled =
          false;


        showStatus(
          `Выбран файл: ${file.name}`,
          false
        );

      }
    );


    // ==================================================
    // ANALYZE
    // ==================================================

    analyzeButton.addEventListener(
      "click",
      async () => {

        if (!selectedFile) {

          return;
        }


        analyzeButton.disabled =
          true;


        result.style.display =
          "none";


        showStatus(
          "Отправляю изображение в Gemini...",
          false
        );


        try {

          const formData =
            new FormData();


          formData.append(
            "file",
            selectedFile
          );


          const response =
            await fetch(
              API_URL,
              {
                method: "POST",
                body: formData
              }
            );


          let data;


          try {

            data =
              await response.json();

          } catch (error) {

            throw new Error(
              `Worker вернул не-JSON ответ. HTTP ${response.status}`
            );

          }


          if (!response.ok) {

            throw new Error(
              data?.detail ||
              `API error: HTTP ${response.status}`
            );

          }


          if (
            data?.success !== true
          ) {

            throw new Error(
              data?.detail ||
              "Analysis failed."
            );

          }


          // ==========================================
          // DISPLAY RESULT
          // ==========================================

          result.style.display =
            "block";


          score.textContent =
            data.score === null ||
            data.score === undefined
              ? "—"
              : Number(data.score)
                  .toFixed(2);


          faceCount.textContent =
            data.face_count ??
            "—";


          featureCount.textContent =
            data.feature_count ??
            data.detected_features ??
            "—";


          model.textContent =
            data.model ??
            "—";


          jsonOutput.textContent =
            JSON.stringify(
              data,
              null,
              2
            );


          showStatus(
            "Готово. Gemini успешно проанализировал изображение.",
            false
          );

        } catch (error) {

          console.error(
            "FaceBot test error:",
            error
          );


          showStatus(
            error?.message ||
            "Не удалось выполнить анализ.",
            true
          );


          result.style.display =
            "block";


          jsonOutput.textContent =
            JSON.stringify(
              {
                success: false,
                error:
                  error?.message ||
                  "Unknown error"
              },
              null,
              2
            );

        } finally {

          analyzeButton.disabled =
            false;

        }

      }
    );


    // ==================================================
    // STATUS
    // ==================================================

    function showStatus(
      message,
      isError
    ) {

      status.textContent =
        message;

      status.style.display =
        "block";

      status.classList.toggle(
        "error",
        Boolean(isError)
      );

    }

  </script>

</body>
</html>
